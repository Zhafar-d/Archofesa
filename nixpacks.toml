[phases.setup]
nixPkgs = ['nodejs', 'php82', 'php82Packages.composer']

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader',
  'npm ci'
]

[start]
cmd = "npm run build && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"

